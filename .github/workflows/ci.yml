name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy by hand, e.g. after changing the Pages settings.
  workflow_dispatch:

# Read-only by default; the deploy job asks for what it needs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install --frozen

      # The videos `deno run shorts` makes, zipped, as they are not in git
      # (see data/shorts.ts). Skipped where the variable is not set, as on
      # forks, and the build carries on with the samples alone.
      - name: Download Shorts videos
        if: vars.SHORTS_ZIP_URL != ''
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/shorts.zip" "$SHORTS_ZIP_URL"
          mkdir -p src/data/shorts
          unzip -q -o "$RUNNER_TEMP/shorts.zip" -d src/data/shorts
        env:
          SHORTS_ZIP_URL: ${{ vars.SHORTS_ZIP_URL }}

      # The same for the music `deno run radio` makes.
      - name: Download Radio music
        if: vars.RADIO_ZIP_URL != ''
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/radio.zip" "$RADIO_ZIP_URL"
          mkdir -p src/data/radio
          unzip -q -o "$RUNNER_TEMP/radio.zip" -d src/data/radio
        env:
          RADIO_ZIP_URL: ${{ vars.RADIO_ZIP_URL }}

      # Biome (format and lint), astro check (types), then theme drift check
      - name: Check
        run: deno run check

      - name: Build
        run: deno run build
        env:
          # Streamed from elsewhere rather than built in: see terminal.ts.
          # Without the variable, the terminal has no movie.
          PUBLIC_MOVIE_URL: ${{ vars.MOVIE_URL }}

      # Only builds of main are published; PR builds just have to succeed.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and never cancel one halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
